version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: experimentflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: experimentflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: experimentflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=experimentflow
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./datasets:/app/datasets
      - ./uploads:/app/uploads

volumes:
  mysql_data:
